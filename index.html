<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CODEX — Tranquility Suite</title>
  <link rel="stylesheet" href="https://realcoolclint.github.io/tranquility-core/tranquility-core.css">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main class="codex">
    <h1>CODEX</h1>
    <p class="subtitle">Script vers prompteur + fiche post-prod</p>
    <label for="wpm">Débit (mots/minute)</label>
    <input type="number" id="wpm" value="160" min="60" max="300">
    <div id="dropzone">
      <p class="dropzone-label">Glisse ton script .docx ici</p>
      <input type="file" id="file-input" accept=".docx" hidden>
    </div>
    <div id="results">
      <div id="results-output"></div>
      <div id="download-actions" class="flex gap-sm" hidden>
        <button type="button" id="btn-download-prompteur" class="btn btn-primary" disabled>TÉLÉCHARGER SCRIPT PROMPTEUR</button>
        <button type="button" id="btn-download-fiche" class="btn btn-secondary" disabled>TÉLÉCHARGER FICHE POST-PROD</button>
        <button type="button" id="btn-download-both" class="btn btn-secondary" disabled>TÉLÉCHARGER LES DEUX</button>
      </div>
    </div>
  </main>
  <script src="vendor/jszip.min.js"></script>
  <script src="docx-writer.js?v=6"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
